<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>政策知识库 · 高考志愿决策系统</title><link rel="stylesheet" href="../css/style.css"><script defer src="../js/common.js"></script><script defer src="../js/knowledge.js"></script></head>
<body data-page="knowledge"><main>
  <div class="page-head"><div><h1>政策知识库</h1><p>招生政策、院校章程与专业资料</p></div></div>
  <div class="two-col"><section><div class="section-head"><h2>知识问答</h2></div><form id="qa-form" class="panel"><div class="field"><label for="question">问题</label><textarea id="question" name="question" required minlength="2" maxlength="1000" placeholder="输入招生政策或专业相关问题"></textarea></div><div class="form-actions"><button id="ask-button" class="button" type="submit">提问</button><button id="search-button" class="button secondary" type="button">检索片段</button></div></form><div id="answer-result" class="section"></div></section><section><div class="section-head"><h2>上传文档</h2></div><form id="upload-form" class="panel"><div class="form-grid"><div class="field"><label for="document-type">资料类型 *</label><select id="document-type" name="document_type"><option value="policy">招生政策</option><option value="charter">招生章程</option><option value="major">专业介绍</option></select></div><div class="field"><label for="applicable-year">适用年份</label><input id="applicable-year" name="applicable_year" type="number" min="1900" max="2100" placeholder="2026"></div><div class="field"><label for="source-name">来源名称 *</label><input id="source-name" name="source_name" required maxlength="200"></div><div class="field"><label for="applicable-region">适用地区</label><input id="applicable-region" name="applicable_region" maxlength="100"></div><div class="field"><label for="source-url">来源链接</label><input id="source-url" name="source_url" type="url" maxlength="1000" placeholder="https://..."></div><div class="field"><label for="document-file">文件 *</label><input id="document-file" name="file" type="file" accept=".pdf,.docx,.txt" required><span class="hint">PDF、DOCX、TXT，最大 10 MB</span></div></div><div id="upload-message" role="status"></div><div class="form-actions"><button id="upload-button" class="button" type="submit">上传文档</button></div></form></section></div>
  <section class="section"><div class="section-head"><h2>文档管理</h2><button id="refresh-documents" class="button secondary small" type="button">刷新</button></div><div id="document-list"></div><div id="document-pages" class="pagination"></div></section>
  <p class="footer-note">资料来源由上传者提供，需自行核验。回答仅作辅助解释，不替代官方政策文本。</p>
</main></body></html>
