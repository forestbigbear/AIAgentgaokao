<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型连接 · 高考志愿决策系统</title><link rel="stylesheet" href="../css/style.css"><script defer src="../js/common.js"></script><script defer src="../js/models.js"></script></head>
<body data-page="models"><main>
  <div class="page-head"><div><h1>模型连接</h1><p>配置知识库问答与文本向量化服务</p></div></div>
  <div class="tabs" id="model-tabs" role="tablist" aria-label="模型类型"><button class="tab active" type="button" data-kind="llm" role="tab" aria-selected="true">问答模型</button><button class="tab" type="button" data-kind="embedding" role="tab" aria-selected="false">Embedding</button></div>
  <div id="config-load" role="status"></div>
  <form id="model-form" class="model-form" hidden>
    <div class="section-head"><h2 id="model-heading">问答模型</h2><span id="model-status" class="pill pending">未配置</span></div>
    <div class="field"><label for="model-key">API 密钥</label><input id="model-key" name="api_key" type="password" autocomplete="off" maxlength="4096" placeholder="填写密钥"><span id="key-hint" class="hint">密钥仅保存在本机配置中。</span></div>
    <label class="model-toggle"><input id="show-model-key" type="checkbox">显示密钥</label>
    <div class="field"><label for="model-base-url">API 基础网址</label><input id="model-base-url" name="base_url" type="url" required maxlength="1000" placeholder="https://服务商地址/v1"><span class="hint">填写 API 根路径，不包含 /embeddings 或 /chat/completions。</span></div>
    <div class="field"><label for="model-name">模型名称</label><input id="model-name" name="model" required maxlength="200" placeholder="填写服务商提供的模型 ID"></div>
    <div id="model-message" role="status"></div>
    <div class="form-actions"><button id="save-model" class="button" type="submit">保存配置</button><button id="test-model" class="button secondary" type="button">测试连接</button><button id="clear-model" class="button danger" type="button">清除配置</button></div>
  </form>
  <p class="footer-note">配置仅供本机使用，密钥不会从读取接口返回。Embedding 用于知识库检索；问答模型用于基于检索资料生成答案。当前六 Agent 的推荐流程仍按已有规则运行。</p>
</main></body></html>
